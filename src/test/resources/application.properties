# Hermetic tests: in-memory H2, no MySQL required
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Kafka: this file REPLACES src/main, so the properties are repeated here.
# The integration test overrides bootstrap-servers with the embedded broker.
spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic=pedidos
# Read from the beginning of the topic so the assertion never races the consumer
spring.kafka.consumer.auto-offset-reset=earliest

# API key de prueba: el listado exige header X-Api-Key
app.admin-api-key=test-admin-key
