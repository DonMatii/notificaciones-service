spring.application.name=notificaciones-service
server.port=8083

# Database connection (environment variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria_my_dreams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka (broker provided by the pedidos-service docker container on :9092)
spring.kafka.bootstrap-servers=localhost:9092
# Read existing events from the beginning: redeliveries are safe because the
# consumer is idempotent (unique pedidoId)
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=pedidos
