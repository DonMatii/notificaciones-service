spring.application.name=notificaciones-service
server.port=8083

# Database connection (environment variables with local fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria_my_dreams?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka (broker provided by the pedidos-service docker container on :9092)
spring.kafka.bootstrap-servers=localhost:9092
# Read existing events from the beginning: redeliveries are safe because the
# consumer is idempotent (unique pedidoId)
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic=pedidos

# SMTP (RF-09): every value comes from environment variables with safe defaults.
# An empty MAIL_HOST disables sending: notifications stay PENDIENTE as before.
# Credentials never live in this file (same pattern as DB_PASS / APP_ADMIN_API_KEY).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:}
